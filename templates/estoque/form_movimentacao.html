{% extends 'base.html' %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-[2.5rem] shadow-sm border border-slate-100 p-10">
    <h3 class="text-xl font-black text-slate-800 mb-8 flex items-center gap-3">
        <i class="fa fa-truck-loading text-emerald-500"></i> Entrada de Produtos
    </h3>

    <form method="post" class="space-y-6" id="formMovimento">
        {% csrf_token %}
        
        <!-- Linha 1: Produto com Busca -->
        <div class="grid grid-cols-1 gap-6">
            <div class="relative">
                <label class="text-[10px] font-black text-slate-400 uppercase ml-1 mb-1 block">Produto</label>
                <input type="text" id="buscaProduto" placeholder="Digite para buscar o produto..." autocomplete="off"
                    class="w-full bg-white border-2 border-slate-200 p-3 rounded-xl focus:border-blue-500 outline-none transition-all">
                <div id="resultadosProduto" class="absolute z-50 w-full bg-white border border-slate-200 rounded-xl shadow-lg mt-1 hidden max-h-60 overflow-y-auto"></div>
                <input type="hidden" name="produto" id="produtoId" value="">
                <div id="produtoSelecionado" class="mt-2 hidden">
                    <span class="inline-flex items-center gap-2 bg-blue-50 text-blue-700 px-3 py-1 rounded-full text-xs font-bold">
                        <span id="produtoNome"></span>
                        <span id="produtoEstoque" class="text-[9px] text-blue-500"></span>
                        <button type="button" onclick="limparProduto()" class="text-blue-400 hover:text-blue-600">&times;</button>
                    </span>
                </div>
            </div>
            <div class="relative">
                <label class="text-[10px] font-black text-slate-400 uppercase ml-1 mb-1 block">Fornecedor</label>
                <input type="text" id="buscaFornecedor" placeholder="Digite para buscar o fornecedor..." autocomplete="off"
                    class="w-full bg-white border-2 border-slate-200 p-3 rounded-xl focus:border-blue-500 outline-none transition-all">
                <div id="resultadosFornecedor" class="absolute z-50 w-full bg-white border border-slate-200 rounded-xl shadow-lg mt-1 hidden max-h-60 overflow-y-auto"></div>
                <input type="hidden" name="fornecedor" id="fornecedorId" value="">
                <div id="fornecedorSelecionado" class="mt-2 hidden">
                    <span class="inline-flex items-center gap-2 bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full text-xs font-bold">
                        <span id="fornecedorNome"></span>
                        <button type="button" onclick="limparFornecedor()" class="text-emerald-400 hover:text-emerald-600">&times;</button>
                    </span>
                </div>
            </div>
        </div>

        <!-- Linha 2: Qtd e Valor -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase ml-1 mb-1 block">Quantidade</label>
                {{ form.quantidade }}
            </div>
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase ml-1 mb-1 block">Valor Unitário (Custo)</label>
                {{ form.valor_unitario }}
            </div>
        </div>

        <!-- Banner de Totalizador -->
        <div class="p-5 bg-emerald-50 rounded-2xl border-2 border-emerald-100 flex justify-between items-center">
            <span class="text-xs font-bold text-emerald-700 uppercase tracking-widest">Total da Operação:</span>
            <span class="text-2xl font-black text-emerald-800" id="displayTotal">R$ 0,00</span>
        </div>

        <!-- Linha 3: Pagamento -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase ml-1 mb-1 block">Forma de Pagamento</label>
                {{ form.forma_pagamento }}
            </div>
            
            <div id="div_caixa">
                <label class="text-[10px] font-black text-blue-500 uppercase ml-1 mb-1 block">Sair dinheiro de qual Caixa?</label>
                {{ form.caixa_pagamento }}
            </div>
            
            <div id="div_parcelas" class="hidden">
                <label class="text-[10px] font-black text-rose-500 uppercase ml-1 mb-1 block">Nº de Parcelas</label>
                {{ form.num_parcelas }}
            </div>
        </div>

        <!-- Oculto -->
        <div class="hidden">{{ form.tipo }}</div>

        <div>
            <label class="text-[10px] font-black text-slate-400 uppercase ml-1 mb-1 block">Observação</label>
            {{ form.observacao }}
        </div>

        <div class="flex gap-4 pt-6">
            <button type="submit" class="flex-1 py-5 bg-slate-900 text-white font-black rounded-2xl shadow-xl hover:bg-black transition-all transform hover:scale-[1.01]">
                CONFIRMAR ENTRADA
            </button>
        </div>
    </form>
</div>

<script>
    // === BUSCA DE PRODUTO ===
    const inputBuscaProduto = document.getElementById('buscaProduto');
    const resultadosProduto = document.getElementById('resultadosProduto');
    const produtoIdInput = document.getElementById('produtoId');
    const produtoSelecionado = document.getElementById('produtoSelecionado');
    let debounceProduto = null;

    inputBuscaProduto.addEventListener('input', function() {
        clearTimeout(debounceProduto);
        const q = this.value.trim();
        if (q.length < 2) { resultadosProduto.classList.add('hidden'); return; }
        debounceProduto = setTimeout(() => {
            fetch(`/estoque/api/produtos/buscar/?q=${encodeURIComponent(q)}`)
                .then(r => r.json())
                .then(data => {
                    if (data.length === 0) { resultadosProduto.classList.add('hidden'); return; }
                    resultadosProduto.innerHTML = data.map(p =>
                        `<div class="px-4 py-3 hover:bg-blue-50 cursor-pointer border-b border-slate-50 last:border-0" onclick="selecionarProduto(${p.id}, '${p.nome.replace(/'/g, "\\'")}', ${p.estoque})">
                            <span class="text-sm font-bold text-slate-700">${p.nome}</span>
                            <span class="text-[10px] text-slate-400 ml-2">Estoque: ${p.estoque}</span>
                        </div>`
                    ).join('');
                    resultadosProduto.classList.remove('hidden');
                });
        }, 300);
    });

    function selecionarProduto(id, nome, estoque) {
        produtoIdInput.value = id;
        document.getElementById('produtoNome').textContent = nome;
        document.getElementById('produtoEstoque').textContent = `Estoque: ${estoque}`;
        produtoSelecionado.classList.remove('hidden');
        inputBuscaProduto.value = '';
        resultadosProduto.classList.add('hidden');
    }

    function limparProduto() {
        produtoIdInput.value = '';
        produtoSelecionado.classList.add('hidden');
    }

    // === BUSCA DE FORNECEDOR ===
    const inputBuscaFornecedor = document.getElementById('buscaFornecedor');
    const resultadosFornecedor = document.getElementById('resultadosFornecedor');
    const fornecedorIdInput = document.getElementById('fornecedorId');
    const fornecedorSelecionado = document.getElementById('fornecedorSelecionado');
    let debounceFornecedor = null;

    inputBuscaFornecedor.addEventListener('input', function() {
        clearTimeout(debounceFornecedor);
        const q = this.value.trim();
        if (q.length < 2) { resultadosFornecedor.classList.add('hidden'); return; }
        debounceFornecedor = setTimeout(() => {
            fetch(`/estoque/api/fornecedores/buscar/?q=${encodeURIComponent(q)}`)
                .then(r => r.json())
                .then(data => {
                    if (data.length === 0) { resultadosFornecedor.classList.add('hidden'); return; }
                    resultadosFornecedor.innerHTML = data.map(f =>
                        `<div class="px-4 py-3 hover:bg-emerald-50 cursor-pointer border-b border-slate-50 last:border-0" onclick="selecionarFornecedor(${f.id}, '${f.nome.replace(/'/g, "\\'")}')">
                            <span class="text-sm font-bold text-slate-700">${f.nome}</span>
                        </div>`
                    ).join('');
                    resultadosFornecedor.classList.remove('hidden');
                });
        }, 300);
    });

    function selecionarFornecedor(id, nome) {
        fornecedorIdInput.value = id;
        document.getElementById('fornecedorNome').textContent = nome;
        fornecedorSelecionado.classList.remove('hidden');
        inputBuscaFornecedor.value = '';
        resultadosFornecedor.classList.add('hidden');
    }

    function limparFornecedor() {
        fornecedorIdInput.value = '';
        fornecedorSelecionado.classList.add('hidden');
    }

    // Fechar dropdowns ao clicar fora
    document.addEventListener('click', function(e) {
        if (!e.target.closest('#buscaProduto') && !e.target.closest('#resultadosProduto')) {
            resultadosProduto.classList.add('hidden');
        }
        if (!e.target.closest('#buscaFornecedor') && !e.target.closest('#resultadosFornecedor')) {
            resultadosFornecedor.classList.add('hidden');
        }
    });

    // === CÁLCULO E PAGAMENTO ===
    const inputQtd = document.querySelector('input[name="quantidade"]');
    const inputVal = document.querySelector('input[name="valor_unitario"]');
    const displayTotal = document.getElementById('displayTotal');
    const selectForma = document.querySelector('select[name="forma_pagamento"]');
    const divCaixa = document.getElementById('div_caixa');
    const divParcelas = document.getElementById('div_parcelas');

    function calcular() {
        let qtd = parseFloat(inputQtd.value) || 0;
        let val = parseFloat(inputVal.value.replace(',', '.')) || 0;
        let total = qtd * val;
        displayTotal.innerText = "R$ " + total.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    }

    function toggleCampos() {
        if (selectForma.value === 'V') {
            divCaixa.classList.remove('hidden');
            divParcelas.classList.add('hidden');
        } else if (selectForma.value === 'P') {
            divCaixa.classList.add('hidden');
            divParcelas.classList.remove('hidden');
        }
    }

    inputQtd.addEventListener('input', calcular);
    inputVal.addEventListener('input', calcular);
    selectForma.addEventListener('change', toggleCampos);
    
    window.onload = function() {
        document.querySelector('select[name="tipo"]').value = 'E';
        toggleCampos();
        calcular();
    };
</script>
{% endblock %}
